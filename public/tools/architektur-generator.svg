      <rect x="352" y="574" width="130" height="34" rx="8" fill="#1E293B"/><text x="417" y="596">Verschlüsselung</text>
      <rect x="494" y="574" width="130" height="34" rx="8" fill="#1E293B"/><text x="559" y="596">Monitoring</text>
      <rect x="636" y="574" width="130" height="34" rx="8" fill="#1E293B"/><text x="701" y="596">MLOps</text>
