  <rect x="48" y="676" width="1104" height="40" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="66" y="701" font-size="13" fill="#1D4ED8">KI-Einordnung: grober Investitionsrahmen Jahr 1 ~ €180–260 k · Risikoprofil moderat · Empfehlung: gestufter Rollout.</text>
