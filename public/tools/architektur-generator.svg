  <line x1="0" y1="46" x2="1200" y2="46" stroke="#E2E8F0"/>

  <text x="48" y="90" class="serif" font-size="13" letter-spacing="2" fill="#1D4ED8" font-weight="600">ARCHITEKTUR</text>
