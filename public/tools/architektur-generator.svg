    <circle cx="270" cy="654" r="6" fill="#C7913A"/><text x="284" y="659" fill="#8A6410">! Konflikt erkannt (Serving ↔ Konnektor-Version)</text>
    <rect x="640" y="642" width="14" height="14" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/><text x="662" y="659">SAP-Fokus aktiv</text>
