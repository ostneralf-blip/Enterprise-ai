      <rect x="372" y="164" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#F0E0C0"/><text x="447" y="185" fill="#8A6410" font-weight="600">EU AI Act</text><text x="447" y="202" fill="#A0791E" font-size="11">Begrenztes Risiko</text>
      <rect x="534" y="164" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#F0E0C0"/><text x="609" y="185" fill="#8A6410" font-weight="600">DSGVO</text><text x="609" y="202" fill="#A0791E" font-size="11">personenbez. Daten</text>
