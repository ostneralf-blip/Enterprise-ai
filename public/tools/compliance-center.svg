<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><style>.serif{font-family:'Lora',Georgia,'Times New Roman',serif}</style></defs>
  <rect width="1200" height="760" fill="#FCFCFA"/>
  <rect width="1200" height="46" fill="#F1F5F9"/>
  <circle cx="26" cy="23" r="5" fill="#CBD5E1"/><circle cx="46" cy="23" r="5" fill="#CBD5E1"/><circle cx="66" cy="23" r="5" fill="#CBD5E1"/>
  <rect x="96" y="12" width="360" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="112" y="27" font-size="12" fill="#94A3B8">enterprise-ai.biz/compliance</text>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#E2E8F0"/>

  <text x="48" y="98" class="serif" font-size="13" letter-spacing="2" fill="#1D4ED8" font-weight="600">COMPLIANCE</text>
  <text x="48" y="132" class="serif" font-size="30" fill="#0F172A" font-weight="600">EU AI Act — Risikoklasse &amp; Dokumentationsstand</text>

  <!-- risk class scale -->
  <rect x="48" y="164" width="1104" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="76" y="200" font-size="12" letter-spacing="1.5" fill="#94A3B8" font-weight="600">RISIKOKLASSE IHRER ANWENDUNG</text>
  <!-- 4 segments -->
  <g>
    <rect x="76" y="216" width="256" height="52" rx="10" fill="#F1F5F9"/><text x="204" y="240" font-size="14" fill="#94A3B8" text-anchor="middle" font-weight="600">Minimal</text><text x="204" y="258" font-size="11" fill="#CBD5E1" text-anchor="middle">keine Auflagen</text>
    <rect x="344" y="216" width="256" height="52" rx="10" fill="#1D4ED8"/><text x="472" y="240" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Begrenzt ◀ Sie</text><text x="472" y="258" font-size="11" fill="#DBEAFE" text-anchor="middle">Transparenzpflichten</text>
    <rect x="612" y="216" width="256" height="52" rx="10" fill="#F1F5F9"/><text x="740" y="240" font-size="14" fill="#94A3B8" text-anchor="middle" font-weight="600">Hoch</text><text x="740" y="258" font-size="11" fill="#CBD5E1" text-anchor="middle">volle Pflichten</text>
    <rect x="880" y="216" width="248" height="52" rx="10" fill="#FEF2F2"/><text x="1004" y="240" font-size="14" fill="#DC2626" text-anchor="middle" font-weight="600">Verboten</text><text x="1004" y="258" font-size="11" fill="#FCA5A5" text-anchor="middle">unzulässig</text>
  </g>
  <text x="76" y="298" font-size="13" fill="#475569">Use Case „Rechnungsprüfung": kein Anhang-III-Bereich, Transparenzhinweis erforderlich.</text>

  <!-- documentation status per regulation -->
  <rect x="48" y="330" width="1104" height="374" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="76" y="368" class="serif" font-size="18" fill="#0F172A" font-weight="600">Dokumentationsstand je Regulierung</text>
  <text x="900" y="368" font-size="12" fill="#94A3B8" text-anchor="end">erledigt / gesamt</text>

  <!-- rows: label, active toggle, progress bar (max 560 @ x=340), fraction, pct -->
  <g font-size="14">
    <!-- DSGVO -->
    <g transform="translate(0,390)">
      <rect x="76" y="10" width="14" height="14" rx="4" fill="#1D4ED8"/><path d="M79 17 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="22" fill="#0F172A" font-weight="600">DSGVO</text>
      <rect x="340" y="8" width="560" height="16" rx="8" fill="#EFF6FF"/><rect x="340" y="8" width="420" height="16" rx="8" fill="#1D4ED8"/>
      <text x="928" y="22" fill="#64748B" text-anchor="end">9 / 12</text><text x="1112" y="22" fill="#1D4ED8" text-anchor="end" font-weight="700">75 %</text>
    </g>
    <!-- EU AI Act -->
    <g transform="translate(0,438)">
      <rect x="76" y="10" width="14" height="14" rx="4" fill="#1D4ED8"/><path d="M79 17 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="22" fill="#0F172A" font-weight="600">EU AI Act</text>
      <rect x="340" y="8" width="560" height="16" rx="8" fill="#EFF6FF"/><rect x="340" y="8" width="308" height="16" rx="8" fill="#1D4ED8"/>
      <text x="928" y="22" fill="#64748B" text-anchor="end">5 / 9</text><text x="1112" y="22" fill="#1D4ED8" text-anchor="end" font-weight="700">55 %</text>
    </g>
    <!-- NIS2 -->
    <g transform="translate(0,486)">
      <rect x="76" y="10" width="14" height="14" rx="4" fill="#1D4ED8"/><path d="M79 17 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="22" fill="#0F172A" font-weight="600">NIS2</text>
      <rect x="340" y="8" width="560" height="16" rx="8" fill="#FEF9F0"/><rect x="340" y="8" width="196" height="16" rx="8" fill="#C7913A"/>
      <text x="928" y="22" fill="#64748B" text-anchor="end">3 / 8</text><text x="1112" y="22" fill="#C7913A" text-anchor="end" font-weight="700">35 %</text>
    </g>
    <!-- ISO 27001 -->
    <g transform="translate(0,534)">
      <rect x="76" y="10" width="14" height="14" rx="4" fill="#1D4ED8"/><path d="M79 17 l3 3 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="22" fill="#0F172A" font-weight="600">ISO 27001</text>
      <rect x="340" y="8" width="560" height="16" rx="8" fill="#EFF6FF"/><rect x="340" y="8" width="504" height="16" rx="8" fill="#1D4ED8"/>
      <text x="928" y="22" fill="#64748B" text-anchor="end">10 / 11</text><text x="1112" y="22" fill="#1D4ED8" text-anchor="end" font-weight="700">90 %</text>
    </g>
    <!-- ISO 42001 inactive -->
    <g transform="translate(0,582)">
      <rect x="76" y="10" width="14" height="14" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="100" y="22" fill="#94A3B8">ISO 42001</text>
      <rect x="340" y="8" width="560" height="16" rx="8" fill="#F1F5F9"/>
      <text x="1112" y="22" fill="#CBD5E1" text-anchor="end">nicht aktiviert</text>
    </g>
  </g>
  <!-- overall -->
  <line x1="76" y1="632" x2="1124" y2="632" stroke="#F1F5F9"/>
  <text x="76" y="668" font-size="14" fill="#334155">Gesamtfortschritt Hochrisiko-Pflichten</text>
  <rect x="76" y="678" width="824" height="14" rx="7" fill="#EFF6FF"/><rect x="76" y="678" width="528" height="14" rx="7" fill="#1D4ED8"/>
  <text x="1112" y="690" font-size="15" fill="#1D4ED8" text-anchor="end" font-weight="700">64 %</text>
</svg>
