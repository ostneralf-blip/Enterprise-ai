<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><style>.serif{font-family:'Lora',Georgia,'Times New Roman',serif}</style></defs>
  <rect width="1200" height="760" fill="#FCFCFA"/>
  <rect width="1200" height="46" fill="#F1F5F9"/>
  <circle cx="26" cy="23" r="5" fill="#CBD5E1"/><circle cx="46" cy="23" r="5" fill="#CBD5E1"/><circle cx="66" cy="23" r="5" fill="#CBD5E1"/>
  <rect x="96" y="12" width="360" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="112" y="27" font-size="12" fill="#94A3B8">enterprise-ai.biz/usecase</text>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#E2E8F0"/>

  <text x="48" y="98" class="serif" font-size="13" letter-spacing="2" fill="#1D4ED8" font-weight="600">PRIORISIERUNG</text>
  <text x="48" y="132" class="serif" font-size="30" fill="#0F172A" font-weight="600">Use-Case Scoring — gewichtete Rangfolge</text>

  <!-- weighting chips -->
  <g font-size="12">
    <text x="48" y="170" fill="#94A3B8">Kriterien &amp; Gewichte:</text>
    <rect x="176" y="156" width="96" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/><text x="224" y="171" fill="#1D4ED8" text-anchor="middle">Nutzen ×30%</text>
    <rect x="280" y="156" width="112" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/><text x="336" y="171" fill="#1D4ED8" text-anchor="middle">Machbarkeit ×25%</text>
    <rect x="400" y="156" width="90" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/><text x="445" y="171" fill="#1D4ED8" text-anchor="middle">Daten ×20%</text>
    <rect x="498" y="156" width="86" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/><text x="541" y="171" fill="#1D4ED8" text-anchor="middle">Risiko ×15%</text>
    <rect x="592" y="156" width="86" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/><text x="635" y="171" fill="#1D4ED8" text-anchor="middle">Fit ×10%</text>
  </g>

  <!-- table card -->
  <rect x="48" y="196" width="1104" height="508" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- header row -->
  <text x="76" y="234" font-size="12" fill="#94A3B8">#</text>
  <text x="120" y="234" font-size="12" fill="#94A3B8">USE CASE</text>
  <text x="560" y="234" font-size="12" fill="#94A3B8">GEWICHTETER SCORE</text>
  <text x="1088" y="234" font-size="12" fill="#94A3B8" text-anchor="end">PKT</text>
  <line x1="76" y1="248" x2="1124" y2="248" stroke="#E2E8F0"/>

  <!-- rows: rank, name, barwidth(max 420 @x560), score -->
  <!-- 1 -->
  <rect x="60" y="266" width="1080" height="62" rx="10" fill="#EFF6FF"/>
  <circle cx="92" cy="297" r="16" fill="#1D4ED8"/><text x="92" y="302" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
  <text x="120" y="293" font-size="15" fill="#0F172A" font-weight="600">Rechnungsprüfung automatisieren</text>
  <text x="120" y="314" font-size="12" fill="#64748B">Finance · hoher Nutzen, gute Datenlage</text>
  <rect x="560" y="288" width="420" height="18" rx="9" fill="#DBEAFE"/><rect x="560" y="288" width="382" height="18" rx="9" fill="#1D4ED8"/>
  <text x="1088" y="303" font-size="18" fill="#1D4ED8" text-anchor="end" font-weight="700">91</text>

  <!-- 2 -->
  <circle cx="92" cy="369" r="16" fill="#3B82F6"/><text x="92" y="374" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
  <text x="120" y="365" font-size="15" fill="#0F172A" font-weight="600">Service-Ticket-Klassifikation</text>
  <text x="120" y="386" font-size="12" fill="#64748B">Support · schnell umsetzbar</text>
  <rect x="560" y="360" width="420" height="18" rx="9" fill="#DBEAFE"/><rect x="560" y="360" width="336" height="18" rx="9" fill="#3B82F6"/>
  <text x="1088" y="375" font-size="18" fill="#1D4ED8" text-anchor="end" font-weight="700">80</text>
  <line x1="76" y1="410" x2="1124" y2="410" stroke="#F1F5F9"/>

  <!-- 3 -->
  <circle cx="92" cy="441" r="16" fill="#94A3B8"/><text x="92" y="446" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
  <text x="120" y="437" font-size="15" fill="#0F172A" font-weight="600">Demand-Forecasting Vertrieb</text>
  <text x="120" y="458" font-size="12" fill="#64748B">Sales · Datenreife noch mittel</text>
  <rect x="560" y="432" width="420" height="18" rx="9" fill="#DBEAFE"/><rect x="560" y="432" width="285" height="18" rx="9" fill="#60A5FA"/>
  <text x="1088" y="447" font-size="18" fill="#334155" text-anchor="end" font-weight="700">68</text>
  <line x1="76" y1="482" x2="1124" y2="482" stroke="#F1F5F9"/>

  <!-- 4 -->
  <circle cx="92" cy="513" r="16" fill="#94A3B8"/><text x="92" y="518" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
  <text x="120" y="509" font-size="15" fill="#0F172A" font-weight="600">HR-Bewerber-Vorauswahl</text>
  <text x="120" y="530" font-size="12" fill="#64748B">HR · hohes Risiko (Hochrisiko-Kandidat)</text>
  <rect x="560" y="504" width="420" height="18" rx="9" fill="#DBEAFE"/><rect x="560" y="504" width="210" height="18" rx="9" fill="#C7913A"/>
  <text x="1088" y="519" font-size="18" fill="#334155" text-anchor="end" font-weight="700">54</text>
  <line x1="76" y1="554" x2="1124" y2="554" stroke="#F1F5F9"/>

  <!-- 5 -->
  <circle cx="92" cy="585" r="16" fill="#CBD5E1"/><text x="92" y="590" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
  <text x="120" y="581" font-size="15" fill="#0F172A" font-weight="600">Marketing-Text-Generierung</text>
  <text x="120" y="602" font-size="12" fill="#64748B">Marketing · geringer strategischer Fit</text>
  <rect x="560" y="576" width="420" height="18" rx="9" fill="#DBEAFE"/><rect x="560" y="576" width="164" height="18" rx="9" fill="#94A3B8"/>
  <text x="1088" y="591" font-size="18" fill="#64748B" text-anchor="end" font-weight="700">42</text>

  <!-- callout -->
  <rect x="60" y="632" width="1080" height="52" rx="10" fill="#FEF9F0" stroke="#F0E0C0"/>
  <text x="84" y="655" font-size="13" fill="#8A6410" font-weight="600">Top-Kandidat → Governance-Check &amp; Roadmap</text>
  <text x="84" y="675" font-size="12" fill="#A0791E">„Rechnungsprüfung automatisieren" wird automatisch für die nächsten Schritte übernommen.</text>
</svg>
