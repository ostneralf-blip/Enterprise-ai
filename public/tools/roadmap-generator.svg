  <rect x="76" y="424" width="150" height="24" rx="12" fill="#FFFBEB" stroke="#F0E0C0"/><text x="151" y="440" font-size="11" fill="#A0791E" text-anchor="middle">⬣ Governance-Freigabe</text>
  <!-- KPI + milestone -->
  <line x1="76" y1="472" x2="372" y2="472" stroke="#F1F5F9"/>
