  <line x1="452" y1="472" x2="748" y2="472" stroke="#F1F5F9"/>
  <text x="452" y="500" font-size="12" fill="#94A3B8">KPI</text>
  <text x="452" y="522" font-size="14" fill="#0F172A" font-weight="600">Durchlaufzeit &lt; 24 h</text>
  <text x="452" y="560" font-size="12" fill="#94A3B8">MEILENSTEIN</text>
