  <rect x="800" y="224" width="352" height="456" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="800" y="224" width="352" height="64" rx="16" fill="#F8FAFC"/>
  <rect x="800" y="256" width="352" height="32" fill="#F8FAFC"/>
