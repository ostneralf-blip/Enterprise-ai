  <text x="828" y="500" font-size="12" fill="#94A3B8">KPI</text>
  <text x="828" y="522" font-size="14" fill="#0F172A" font-weight="600">ROI positiv über Portfolio</text>
  <text x="828" y="560" font-size="12" fill="#94A3B8">MEILENSTEIN</text>
  <text x="828" y="582" font-size="14" fill="#0F172A" font-weight="600">Skalierte KI-Organisation</text>
