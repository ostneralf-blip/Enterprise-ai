    <circle cx="80" cy="196" r="5" fill="#1D4ED8"/><text x="80" y="180">HEUTE</text>
    <circle cx="426" cy="196" r="5" fill="#CBD5E1"/><text x="426" y="180">+3 M</text>
    <circle cx="773" cy="196" r="5" fill="#CBD5E1"/><text x="773" y="180">+6 M</text>
    <circle cx="1120" cy="196" r="5" fill="#CBD5E1"/><text x="1120" y="180">+12 M</text>
  </g>

