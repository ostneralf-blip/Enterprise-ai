<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><style>.serif{font-family:'Lora',Georgia,'Times New Roman',serif}</style></defs>
  <rect width="1200" height="760" fill="#FCFCFA"/>
  <rect width="1200" height="46" fill="#F1F5F9"/>
  <circle cx="26" cy="23" r="5" fill="#CBD5E1"/><circle cx="46" cy="23" r="5" fill="#CBD5E1"/><circle cx="66" cy="23" r="5" fill="#CBD5E1"/>
  <rect x="96" y="12" width="360" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="112" y="27" font-size="12" fill="#94A3B8">enterprise-ai.biz/canvas</text>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#E2E8F0"/>

  <text x="48" y="98" class="serif" font-size="13" letter-spacing="2" fill="#1D4ED8" font-weight="600">USE-CASE-DESIGN</text>
  <text x="48" y="132" class="serif" font-size="30" fill="#0F172A" font-weight="600">AI Use-Case Canvas — Rechnungsprüfung</text>

  <!-- canvas grid: 3 cols x 2 rows -->
  <g>
    <!-- helper via repeated cards -->
    <!-- row 1 -->
    <rect x="48" y="164" width="352" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="72" y="196" font-size="12" letter-spacing="1.5" fill="#1D4ED8" font-weight="600">PROBLEM</text>
    <text x="72" y="226" font-size="14" fill="#334155">Manuelle Prüfung von 12.000</text>
    <text x="72" y="248" font-size="14" fill="#334155">Eingangsrechnungen / Monat</text>
    <text x="72" y="270" font-size="14" fill="#334155">bindet 4 VZÄ und verzögert</text>
    <text x="72" y="292" font-size="14" fill="#334155">Skonto-Fristen.</text>

    <rect x="424" y="164" width="352" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="448" y="196" font-size="12" letter-spacing="1.5" fill="#1D4ED8" font-weight="600">NUTZEN</text>
    <text x="448" y="226" font-size="14" fill="#334155">Automatische Extraktion &amp;</text>
    <text x="448" y="248" font-size="14" fill="#334155">Kontierung, Freigabe nur bei</text>
    <text x="448" y="270" font-size="14" fill="#334155">Abweichung.</text>
    <text x="448" y="298" font-size="13" fill="#059669" font-weight="600">≈ 70 % weniger Handarbeit</text>

    <rect x="800" y="164" width="352" height="200" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="824" y="196" font-size="12" letter-spacing="1.5" fill="#1D4ED8" font-weight="600">DATEN</text>
    <text x="824" y="226" font-size="14" fill="#334155">PDF/EDI-Rechnungen, SAP-</text>
    <text x="824" y="248" font-size="14" fill="#334155">Stammdaten, Bestellhistorie.</text>
    <text x="824" y="278" font-size="13" fill="#B45309">Enthält personenbez. Daten</text>

    <!-- row 2 -->
    <rect x="48" y="380" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="72" y="412" font-size="12" letter-spacing="1.5" fill="#1D4ED8" font-weight="600">RISIKEN</text>
    <text x="72" y="442" font-size="14" fill="#334155">Falschkontierung, Bias bei</text>
    <text x="72" y="464" font-size="14" fill="#334155">Lieferanten-Priorisierung,</text>
    <text x="72" y="486" font-size="14" fill="#334155">Fehlbuchungen ohne Review.</text>

    <rect x="424" y="380" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="448" y="412" font-size="12" letter-spacing="1.5" fill="#1D4ED8" font-weight="600">KOMPONENTEN</text>
    <text x="448" y="440" font-size="14" fill="#334155">Erforderliche Bausteine:</text>

    <rect x="800" y="380" width="352" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="824" y="412" font-size="12" letter-spacing="1.5" fill="#1D4ED8" font-weight="600">ERFOLGSKRITERIEN</text>
    <text x="824" y="442" font-size="14" fill="#334155">Durchlaufzeit &lt; 24 h</text>
    <text x="824" y="466" font-size="14" fill="#334155">Trefferquote &gt; 95 %</text>
    <text x="824" y="490" font-size="14" fill="#334155">Skonto-Quote +8 pp</text>
  </g>

  <!-- detected component chips -->
  <g font-size="13">
    <rect x="448" y="452" width="86" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/><text x="491" y="469" fill="#1D4ED8" text-anchor="middle">SAP S/4HANA</text>
    <rect x="542" y="452" width="72" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/><text x="578" y="469" fill="#1D4ED8" text-anchor="middle">OCR / IDP</text>
    <rect x="448" y="486" width="70" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/><text x="483" y="503" fill="#1D4ED8" text-anchor="middle">LLM-API</text>
    <rect x="526" y="486" width="96" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/><text x="574" y="503" fill="#1D4ED8" text-anchor="middle">Vector Store</text>
  </g>
  <text x="644" y="470" font-size="11" fill="#94A3B8">auto-erkannt</text>

  <!-- compliance classification banner -->
  <rect x="48" y="548" width="1104" height="80" rx="14" fill="#1D4ED8"/>
  <text x="76" y="582" font-size="12" letter-spacing="1.5" fill="#BFDBFE" font-weight="600">EU-AI-ACT-EINORDNUNG (AUTOMATISCH)</text>
  <text x="76" y="610" class="serif" font-size="20" fill="#FFFFFF" font-weight="600">Begrenztes Risiko · Transparenzpflichten</text>
  <g font-size="12" text-anchor="middle">
    <rect x="712" y="568" width="120" height="42" rx="10" fill="#3B82F6"/><text x="772" y="584" fill="#FFFFFF">DSGVO</text><text x="772" y="600" fill="#DBEAFE">relevant</text>
    <rect x="844" y="568" width="120" height="42" rx="10" fill="#3B82F6"/><text x="904" y="584" fill="#FFFFFF">Datenqualität</text><text x="904" y="600" fill="#DBEAFE">zu prüfen</text>
    <rect x="976" y="568" width="152" height="42" rx="10" fill="#C7913A"/><text x="1052" y="584" fill="#FFFFFF">Human-in-the-loop</text><text x="1052" y="600" fill="#FDF0D8">empfohlen</text>
  </g>

  <!-- footer hint -->
  <text x="48" y="672" font-size="13" fill="#94A3B8">Fließt direkt in Scoring, Governance-Check und Architektur-Generator ein.</text>
</svg>
